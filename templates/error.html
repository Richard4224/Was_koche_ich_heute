{% extends "layout.html" %}

{% block title %}
    Fehler {{ code }}
{% endblock %}

{% block main %}
    <div class="glass error-box">
        <p class="error-code">{{ code }}</p>
        <p class="error-flavor">Du hast dich im Wald verirrt.</p>
        <p class="error-message">{{ message }}</p>
        <a href="/#rezepte" class="btn btn-amber">Zurück zum Rezeptbuch</a>
    </div>
{% endblock %}
